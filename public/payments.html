<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payments - FPay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        nav {
            background: white;
            padding: 15px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-brand {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            text-decoration: none;
            color: #666;
            padding: 8px 16px;
            border-radius: 5px;
            transition: all 0.3s;
        }

        .nav-links a:hover {
            background: #667eea;
            color: white;
        }

        .nav-links a.active {
            background: #667eea;
            color: white;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-group label {
            font-weight: 600;
            color: #333;
        }

        select, input {
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        thead {
            background: #28a745;
            color: white;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            font-weight: 600;
        }

        tbody tr {
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .status-pending { background: #fff3cd; color: #856404; }
        .status-processing { background: #cfe2ff; color: #084298; }
        .status-completed { background: #d1e7dd; color: #0f5132; }
        .status-failed { background: #f8d7da; color: #842029; }
        .status-refunded { background: #e0e0e0; color: #666; }

        .method-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85em;
            background: #e7f3ff;
            color: #004085;
        }

        .amount {
            font-weight: 600;
            color: #28a745;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 1.2em;
        }

        .error {
            background: #f8d7da;
            color: #842029;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            border: 1px solid #f5c2c7;
        }

        .no-data {
            text-align: center;
            padding: 60px;
            color: #999;
            font-size: 1.1em;
        }

        .transaction-id {
            font-family: monospace;
            font-size: 0.9em;
            color: #666;
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-brand">🚛 FPay</div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/invoices.html">Invoices</a>
            <a href="/payments.html" class="active">Payments</a>
            <a href="/admin.html">Admin</a>
        </div>
    </nav>

    <div class="container">
        <h1>💳 Payments</h1>
        <div class="subtitle">Track and manage payment transactions</div>

        <div class="stats-bar" id="statsBar">
            <div class="stat-card">
                <div class="stat-value" id="totalPayments">-</div>
                <div class="stat-label">Total Payments</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalAmount">-</div>
                <div class="stat-label">Total Amount</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="completedCount">-</div>
                <div class="stat-label">Completed</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="processingCount">-</div>
                <div class="stat-label">Processing</div>
            </div>
        </div>

        <div class="filters">
            <div class="filter-group">
                <label>Status:</label>
                <select id="statusFilter">
                    <option value="">All</option>
                    <option value="pending">Pending</option>
                    <option value="processing">Processing</option>
                    <option value="completed">Completed</option>
                    <option value="failed">Failed</option>
                    <option value="refunded">Refunded</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Payment Method:</label>
                <select id="methodFilter">
                    <option value="">All</option>
                    <option value="credit_card">Credit Card</option>
                    <option value="ach">ACH</option>
                    <option value="wire_transfer">Wire Transfer</option>
                    <option value="check">Check</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Search:</label>
                <input type="text" id="searchInput" placeholder="Transaction ID, Payer...">
            </div>
        </div>

        <div class="table-container">
            <div id="loading" class="loading">Loading payments...</div>
            <div id="error" class="error" style="display: none;"></div>
            <div id="noData" class="no-data" style="display: none;">
                No payments found. Run <code>npm run seed</code> to create sample data.
            </div>
            <table id="paymentsTable" style="display: none;">
                <thead>
                    <tr>
                        <th>Transaction ID</th>
                        <th>Invoice #</th>
                        <th>Payer</th>
                        <th>Amount</th>
                        <th>Fee</th>
                        <th>Total</th>
                        <th>Method</th>
                        <th>Status</th>
                        <th>Payment Date</th>
                    </tr>
                </thead>
                <tbody id="paymentsBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let allPayments = [];

        async function loadPayments() {
            try {
                const response = await fetch('/api/payments');
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to load payments');
                }

                allPayments = data.data;
                updateStats(allPayments);
                displayPayments(allPayments);

                document.getElementById('loading').style.display = 'none';

                if (allPayments.length === 0) {
                    document.getElementById('noData').style.display = 'block';
                } else {
                    document.getElementById('paymentsTable').style.display = 'table';
                }
            } catch (error) {
                console.error('Error loading payments:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').textContent = `Error: ${error.message}`;
                document.getElementById('error').style.display = 'block';
            }
        }

        function updateStats(payments) {
            const totalPayments = payments.length;
            const totalAmount = payments.reduce((sum, pay) => sum + (pay.totalAmount || pay.amount + pay.processingFee || 0), 0);
            const completedCount = payments.filter(pay => pay.status === 'completed').length;
            const processingCount = payments.filter(pay => pay.status === 'processing').length;

            document.getElementById('totalPayments').textContent = totalPayments;
            document.getElementById('totalAmount').textContent = `$${totalAmount.toFixed(2)}`;
            document.getElementById('completedCount').textContent = completedCount;
            document.getElementById('processingCount').textContent = processingCount;
        }

        function displayPayments(payments) {
            const tbody = document.getElementById('paymentsBody');
            tbody.innerHTML = '';

            payments.forEach(payment => {
                const row = document.createElement('tr');

                const invoiceNumber = payment.invoiceId?.invoiceNumber || 'N/A';
                const totalAmount = payment.totalAmount || (payment.amount + payment.processingFee);

                row.innerHTML = `
                    <td class="transaction-id">${payment.transactionId}</td>
                    <td>${invoiceNumber}</td>
                    <td>${payment.payer?.name || 'N/A'}</td>
                    <td class="amount">$${payment.amount.toFixed(2)}</td>
                    <td>$${payment.processingFee.toFixed(2)}</td>
                    <td class="amount">$${totalAmount.toFixed(2)}</td>
                    <td><span class="method-badge">${payment.paymentMethod.replace('_', ' ')}</span></td>
                    <td><span class="status-badge status-${payment.status}">${payment.status}</span></td>
                    <td>${new Date(payment.paymentDate).toLocaleDateString()}</td>
                `;

                tbody.appendChild(row);
            });
        }

        function filterPayments() {
            const statusFilter = document.getElementById('statusFilter').value;
            const methodFilter = document.getElementById('methodFilter').value;
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            let filtered = allPayments;

            if (statusFilter) {
                filtered = filtered.filter(pay => pay.status === statusFilter);
            }

            if (methodFilter) {
                filtered = filtered.filter(pay => pay.paymentMethod === methodFilter);
            }

            if (searchTerm) {
                filtered = filtered.filter(pay =>
                    pay.transactionId.toLowerCase().includes(searchTerm) ||
                    pay.payer?.name.toLowerCase().includes(searchTerm) ||
                    pay.payer?.email.toLowerCase().includes(searchTerm)
                );
            }

            displayPayments(filtered);
        }

        document.getElementById('statusFilter').addEventListener('change', filterPayments);
        document.getElementById('methodFilter').addEventListener('change', filterPayments);
        document.getElementById('searchInput').addEventListener('input', filterPayments);

        // Load payments on page load
        document.addEventListener('DOMContentLoaded', loadPayments);
    </script>
</body>
</html>
