<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoices - FPay</title>
    <link rel="stylesheet" href="/mobile.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        nav {
            background: white;
            padding: 15px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-brand {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            text-decoration: none;
            color: #666;
            padding: 8px 16px;
            border-radius: 5px;
            transition: all 0.3s;
        }

        .nav-links a:hover {
            background: #667eea;
            color: white;
        }

        .nav-links a.active {
            background: #667eea;
            color: white;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-group label {
            font-weight: 600;
            color: #333;
        }

        select, input {
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        thead {
            background: #667eea;
            color: white;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            font-weight: 600;
        }

        tbody tr {
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .status-draft { background: #e0e0e0; color: #666; }
        .status-sent { background: #fff3cd; color: #856404; }
        .status-viewed { background: #cfe2ff; color: #084298; }
        .status-paid { background: #d1e7dd; color: #0f5132; }
        .status-partially_paid { background: #f8d7da; color: #842029; }
        .status-overdue { background: #f8d7da; color: #842029; }
        .status-cancelled { background: #e0e0e0; color: #666; }

        .amount {
            font-weight: 600;
            color: #667eea;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 1.2em;
        }

        .error {
            background: #f8d7da;
            color: #842029;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            border: 1px solid #f5c2c7;
        }

        .no-data {
            text-align: center;
            padding: 60px;
            color: #999;
            font-size: 1.1em;
        }

        .invoice-details {
            cursor: pointer;
        }

        .invoice-details:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-brand">🚛 FPay</div>
        <button class="hamburger" onclick="toggleMenu()" aria-label="Toggle menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <div class="nav-links" id="navLinks">
            <a href="/">Home</a>
            <a href="/invoices.html" class="active">Invoices</a>
            <a href="/payments.html">Payments</a>
            <a href="/admin.html">Admin</a>
        </div>
    </nav>

    <div class="container">
        <h1>📄 Invoices</h1>
        <div class="subtitle">Manage and track freight invoices</div>

        <div class="stats-bar" id="statsBar">
            <div class="stat-card">
                <div class="stat-value" id="totalInvoices">-</div>
                <div class="stat-label">Total Invoices</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalAmount">-</div>
                <div class="stat-label">Total Amount</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="paidCount">-</div>
                <div class="stat-label">Paid Invoices</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="overdueCount">-</div>
                <div class="stat-label">Overdue</div>
            </div>
        </div>

        <div class="filters">
            <div class="filter-group">
                <label>Status:</label>
                <select id="statusFilter">
                    <option value="">All</option>
                    <option value="draft">Draft</option>
                    <option value="sent">Sent</option>
                    <option value="viewed">Viewed</option>
                    <option value="paid">Paid</option>
                    <option value="partially_paid">Partially Paid</option>
                    <option value="overdue">Overdue</option>
                    <option value="cancelled">Cancelled</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Search:</label>
                <input type="text" id="searchInput" placeholder="Invoice #, Customer...">
            </div>
        </div>

        <div class="table-container">
            <div id="loading" class="loading">Loading invoices...</div>
            <div id="error" class="error" style="display: none;"></div>
            <div id="noData" class="no-data" style="display: none;">
                No invoices found. Run <code>npm run seed</code> to create sample data.
            </div>
            <table id="invoicesTable" style="display: none;">
                <thead>
                    <tr>
                        <th>Invoice #</th>
                        <th>Customer</th>
                        <th>Carrier</th>
                        <th>Route</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Issue Date</th>
                        <th>Due Date</th>
                    </tr>
                </thead>
                <tbody id="invoicesBody">
                </tbody>
            </table>
            <div id="invoicesCards" class="mobile-cards" style="display: none;"></div>
        </div>
    </div>

    <script>
        let allInvoices = [];

        async function loadInvoices() {
            try {
                const response = await fetch('/api/invoices');
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to load invoices');
                }

                allInvoices = data.data;
                updateStats(allInvoices);
                displayInvoices(allInvoices);

                document.getElementById('loading').style.display = 'none';

                if (allInvoices.length === 0) {
                    document.getElementById('noData').style.display = 'block';
                } else {
                    document.getElementById('invoicesTable').style.display = 'table';
                }
            } catch (error) {
                console.error('Error loading invoices:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').textContent = `Error: ${error.message}`;
                document.getElementById('error').style.display = 'block';
            }
        }

        function updateStats(invoices) {
            const totalInvoices = invoices.length;
            const totalAmount = invoices.reduce((sum, inv) => sum + (inv.totalAmount || 0), 0);
            const paidCount = invoices.filter(inv => inv.status === 'paid').length;
            const overdueCount = invoices.filter(inv => inv.status === 'overdue' ||
                (inv.status !== 'paid' && new Date(inv.dueDate) < new Date())).length;

            document.getElementById('totalInvoices').textContent = totalInvoices;
            document.getElementById('totalAmount').textContent = `$${totalAmount.toFixed(2)}`;
            document.getElementById('paidCount').textContent = paidCount;
            document.getElementById('overdueCount').textContent = overdueCount;
        }

        // Mobile menu toggle
        function toggleMenu() {
            const navLinks = document.getElementById('navLinks');
            const hamburger = document.querySelector('.hamburger');
            navLinks.classList.toggle('active');
            hamburger.classList.toggle('active');
        }

        function displayInvoices(invoices) {
            const tbody = document.getElementById('invoicesBody');
            const cards = document.getElementById('invoicesCards');
            tbody.innerHTML = '';
            cards.innerHTML = '';

            invoices.forEach(invoice => {
                const route = `${invoice.shipment?.origin?.city || 'N/A'}, ${invoice.shipment?.origin?.state || ''} → ${invoice.shipment?.destination?.city || 'N/A'}, ${invoice.shipment?.destination?.state || ''}`;

                // Desktop table row
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="invoice-details">${invoice.invoiceNumber}</td>
                    <td>${invoice.customer?.name || 'N/A'}</td>
                    <td>${invoice.carrier?.name || 'N/A'}</td>
                    <td>${route}</td>
                    <td class="amount">$${(invoice.totalAmount || 0).toFixed(2)}</td>
                    <td><span class="status-badge status-${invoice.status}">${invoice.status.replace('_', ' ')}</span></td>
                    <td>${new Date(invoice.issueDate).toLocaleDateString()}</td>
                    <td>${new Date(invoice.dueDate).toLocaleDateString()}</td>
                `;
                tbody.appendChild(row);

                // Mobile card
                const card = document.createElement('div');
                card.className = 'mobile-card';
                card.innerHTML = `
                    <div class="mobile-card-header">
                        <div class="mobile-card-title">${invoice.invoiceNumber}</div>
                        <span class="status-badge status-${invoice.status}">${invoice.status.replace('_', ' ')}</span>
                    </div>
                    <div class="mobile-card-row">
                        <span class="mobile-card-label">Customer:</span>
                        <span class="mobile-card-value">${invoice.customer?.name || 'N/A'}</span>
                    </div>
                    <div class="mobile-card-row">
                        <span class="mobile-card-label">Carrier:</span>
                        <span class="mobile-card-value">${invoice.carrier?.name || 'N/A'}</span>
                    </div>
                    <div class="mobile-card-row">
                        <span class="mobile-card-label">Route:</span>
                        <span class="mobile-card-value">${route}</span>
                    </div>
                    <div class="mobile-card-row">
                        <span class="mobile-card-label">Amount:</span>
                        <span class="mobile-card-value amount">$${(invoice.totalAmount || 0).toFixed(2)}</span>
                    </div>
                    <div class="mobile-card-row">
                        <span class="mobile-card-label">Issue Date:</span>
                        <span class="mobile-card-value">${new Date(invoice.issueDate).toLocaleDateString()}</span>
                    </div>
                    <div class="mobile-card-row">
                        <span class="mobile-card-label">Due Date:</span>
                        <span class="mobile-card-value">${new Date(invoice.dueDate).toLocaleDateString()}</span>
                    </div>
                `;
                cards.appendChild(card);
            });

            // Show/hide based on screen size
            if (window.innerWidth <= 768) {
                document.getElementById('invoicesTable').style.display = 'none';
                cards.style.display = 'block';
            } else {
                document.getElementById('invoicesTable').style.display = 'table';
                cards.style.display = 'none';
            }
        }

        function filterInvoices() {
            const statusFilter = document.getElementById('statusFilter').value;
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            let filtered = allInvoices;

            if (statusFilter) {
                filtered = filtered.filter(inv => inv.status === statusFilter);
            }

            if (searchTerm) {
                filtered = filtered.filter(inv =>
                    inv.invoiceNumber.toLowerCase().includes(searchTerm) ||
                    inv.customer?.name.toLowerCase().includes(searchTerm) ||
                    inv.carrier?.name.toLowerCase().includes(searchTerm)
                );
            }

            displayInvoices(filtered);
        }

        document.getElementById('statusFilter').addEventListener('change', filterInvoices);
        document.getElementById('searchInput').addEventListener('input', filterInvoices);

        // Load invoices on page load
        document.addEventListener('DOMContentLoaded', loadInvoices);
    </script>
</body>
</html>
